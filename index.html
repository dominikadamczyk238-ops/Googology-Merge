
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Micronym Merge</title>
<style>
@import url('https://cdnfonts.com');

* { box-sizing:border-box; }

html,body {
  margin:0;
  width:100%;
  min-height:100%;
  font-family:'Glacial Indifference',sans-serif!important;
  user-select:none;
}

body {
  background: hsl(calc(240deg + var(--tier) - 1deg), 100%, 50%);
  color:rgba(255, 255, 255, 0.858);
  font-weight:700;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:25px;
}

/* TITLE + SPAWN TEXT */
#s {
  font-size:30px;
  letter-spacing:2px;
  margin-bottom:5px;
  text-align:center;
}

#p {
  color:#33ff00;
  font-size:16px;
  margin-bottom:15px;
  letter-spacing:1px;
  animation:blink 1.5s infinite;
  text-align:center;
}

@keyframes blink {
  0%,100% { opacity:1; }
  50% { opacity:.5; }
}

/* BUTTONS */
.controls {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-bottom:20px;
}

button {
  padding:10px 15px;
  font-weight:700;
  font-size:14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  letter-spacing:1px;
  transition:.15s;
  min-width:140px;
}

#uBtn {
  background:#981eef;
  color:#1c1c24;
}

#resetBtn {
  background:#ff4757;
  color:white;
}

button:hover { transform:scale(1.04); }
button:active { transform:scale(.96); }

#uBtn:disabled {
  opacity:.45;
  cursor:not-allowed;
}

/* RESPONSIVE GRID */
#g {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));
  gap:8px;
  background:#1c1c24;
  padding:15px;
  border-radius:16px;
  box-shadow:0 8px 32px rgba(0,0,0,.4);
  width:100%;
  max-width:1200px;
}

/* TILES */
.tile {
  width:100%;
  aspect-ratio:1/1;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10px;
  cursor:pointer;
  overflow:hidden;
  position:relative;
  transition:transform .12s,filter .12s,box-shadow .12s;
  color:white;
  text-shadow:
    0 2px 3px rgba(0,0,0,.8),
    0 0 5px rgba(0,0,0,.5);
}

.tile:hover {
  transform:scale(1.025);
  filter:brightness(1.1);
}

.tile.empty {
  background:#282833;
  cursor:default;
}

.tile.selected {
  transform:scale(.9);
  border:3px solid white;
  box-shadow:0 0 20px white;
}

.tile-name {
  font-size:13px;
  line-height:1.15;
  overflow-wrap:anywhere;
}

.tile-tier {
  position:absolute;
  bottom:5px;
  right:7px;
  font-size:11px;
  opacity:.75;
}

/* LEADERBOARD */
.leaderboard {
  margin-top:20px;
  background:#1c1c24;
  padding:12px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.3);
  width:100%;
  max-width:320px;
  text-align:center;
  color:white;
  font-size:14px;
}

.leaderboard h3 {
  margin:0 0 8px;
  color:#f7b731;
  font-size:16px;
  letter-spacing:1px;
}
</style>
</head>

        ];

        this.frac = ["", "·", ":", "∴", "∷", "⁙"];
    }

    mapToRoman(n) {
        let out = "";
        for (const [v, r] of this.F) {
            while (n >= v) {
                out += r;
                n -= v;
            }
        }
        return out;
    }

    fracPart(x) {
        let t = Math.round(x * 12);

        if (t === 0) return "";
        if (t === 12) return ""; // full unit

        if (t < 6) return this.frac[t];
        return "S" + this.frac[t - 6];
    }

    formatDecimal(n) {
        if (n.m === 0) return "O";

        // exponent = floor(e / 9)
        let exp = Math.floor(n.e / 9);

        // leftover exponent
        let remExp = n.e % 9;

        // mantissa scaled by leftover exponent
        let mantissa = n.m * Math.pow(10, remExp);

        // clamp mantissa into 1–3999 range
        let intPart = Math.floor(mantissa % 4000000000);
        if (intPart === 0) intPart = 1;

        let frac = mantissa - Math.floor(mantissa);

        // Roman mantissa
        let romanMantissa = this.mapToRoman(intPart);

        if (frac > 0 && frac < 1) {
            romanMantissa += this.fracPart(frac);
        }

        // Roman exponent
               let romanExp = this.formatExponent(exp);
        return romanMantissa + "^" + romanExp;
   }   
     
 
    
formatExponent(exp) {
    if (exp <= 3999999999) {
        return this.mapToRoman(exp);
    }

    let base = exp % 4000000000;
    let tier = Math.floor(exp / 4000000000);

    let baseRoman = this.mapToRoman(base);
    let tierRoman = this.mapToRoman(tier);

    return baseRoman + "^" + tierRoman;
}

      



    get name() {
        return "Roman";
    }
  }

  }
  return fNum({m,e});

/* =========================================================
   BIG NUMBER
   ========================================================= */

const nNew=(m,e)=>{
  if(m===0)return{m:0,e:0};

  const c=Math.floor(
    Math.log10(Math.abs(m))
  );

  return{
    m:m/Math.pow(10,c),
    e:e+c
  };
};

const nAdd=(a,b)=>{
  if(a.m===0)return b;
  if(b.m===0)return a;

  const d=a.e-b.e;

  if(d>15)return a;
  if(d<-15)return b;

  return nNew(
    a.m*Math.pow(10,d)+b.m,
    b.e
  );
};

const nSub=(a,b)=>{
  const d=a.e-b.e;

  if(d>15)return a;
  if(d<-15)return nNew(-b.m,b.e);

  return nNew(
    a.m*Math.pow(10,d)-b.m,
    b.e
  );
};

const nGte=(a,b)=>{
  if(a.e!==b.e){
    return a.e>b.e;
  }

  return a.m>=b.m;
};

const nPow=(base,exponent)=>{
  if(exponent===0){
    return{m:1,e:0};
  }

  const t=
    exponent*Math.log10(base);

  const e=Math.floor(t);

  return nNew(
    Math.pow(10,t-e),
    e
  );
};

const fNum=n=>{
  if(n.m===0)return"0";

  if(n.e<4){
    return Math.floor(
      n.m*Math.pow(10,n.e)
    ).toString();
  }

  return n.m.toFixed(2)+"e"+n.e;
};

/* =========================================================
   TIER COLORS
   ========================================================= */

function tierColor(tier){

  // Up to 720 → normal HSL color
  if (tier <= 720) {
    const hue = (((tier - 1) % 360) + 1) * 5;
    return `hsl(${hue},100%,50%)`;
  }

  // After 720 → gradient based on hue
  const hue = (((tier - 1) % 360) + 1) * 5;

  const c1 = `hsl(${hue},100%,50%)`;
  const c2 = `hsl(${(hue + 45) % 360},100%,50%)`;

  return `linear-gradient(90deg, ${c1}, ${c2})`;
}


/* =========================================================
   BOARD
   ========================================================= */

function fillBoard(){

  const spawn=
    getSpawnTier();

  grid.forEach((x,i)=>{

    if(x===0){

      grid[i]=spawn;

    }

    if(
      grid[i]>maxTileInRun
    ){

      maxTileInRun=
        grid[i];

    }

  });

  if(
    maxTileInRun>
    bestTileAllTime
  ){

    bestTileAllTime=
      maxTileInRun;

  }

}

function mergeAll(){

  // 10 second cooldown
  if(mergeAllCooldown){
    return;
  }

  mergeAllCooldown=true;

  let merged=true;

  while(merged){

    merged=false;

    // Find two tiles of the same tier
    outer:
    for(let a=0;a<grid.length;a++){

      if(grid[a]===0){
        continue;
      }

      for(let b=a+1;b<grid.length;b++){

        if(
          grid[b]===grid[a] &&
          grid[b]>0
        ){

          const tier=
            grid[a];

          const next=
            tier+1;

          // Remove both
          grid[a]=0;
          grid[b]=0;

          // Create next tier
          grid[b]=next;


          // Best tile
          if(next>maxTileInRun){
            maxTileInRun=next;
          }

          if(maxTileInRun>bestTileAllTime){
            bestTileAllTime=maxTileInRun;
          }

          merged=true;

          break outer;
        }

      }

    }

  }

  selected=null;

  // Refill empty spaces after ALL merging is finished
  fillBoard();

  save();
  render();

  // 10 seconds
  setTimeout(()=>{

    mergeAllCooldown=false;

  },10000);

}


/* =========================================================
   MERGE ALL KEYBIND
   M = MERGE ALL
   ========================================================= */

document.addEventListener("keydown",(e)=>{

  if(
    e.key.toLowerCase()==="m" &&
    !e.repeat
  ){

    mergeAll();

  }

});

/* =========================================================
   CLICK TILE
   ========================================================= */

function clickTile(index){

  const from=
    selected;

  const to=
    grid[index];

  if(
    from===null
  ){

    if(
      to>0
    ){

      selected=index;

    }

    render();
    return;

  }

  if(
    from===index
  ){

    selected=null;
    render();
    return;

  }


  /* =====================================================
     SAME TIER = NEXT GOOGOLOGISM
     ===================================================== */

  if(
    from!==null &&
    grid[from]===to &&
    to>0
  ){

    const next=
      grid[from]+1;

    grid[from]=0;
    grid[index]=next;
    if(
      next>maxTileInRun
    ){

      maxTileInRun=
        next;

    }

    if(
      maxTileInRun>
      bestTileAllTime
    ){

      bestTileAllTime=
        maxTileInRun;

    }

    selected=null;

    fillBoard();
    save();
    render();

    return;
  }


  /* =====================================================
     MOVE
     ===================================================== */

  if(to===0){

    grid[index]=
      grid[from];

    grid[from]=0;

    selected=null;

    save();
    render();

    return;
  }


  /* SELECT OTHER TILE */
  selected =
    to > 0
      ? index
      : null;

  render();

}

/* =========================================================
   UPGRADE
   ========================================================= */

function buyUpgrade(){

  const cost=
    getCost();

  if(
    !nGte(
      coins,
      cost
    )
  ){

    return;

  }

  coins=
    nSub(
      coins,
      cost
    );

  upgradeTier++;


  const spawn=
    getSpawnTier();

  grid.forEach((x,i)=>{

    if(
      x>0&&
      x<spawn
    ){

      grid[i]=spawn;

    }

  });

  fillBoard();

  save();
  render();

}


/* =========================================================
   RESET RUN
   DOES NOT DELETE BEST SCORE
   ========================================================= */

function resetGame(){

  if(
    !confirm(
      "Zresetować run?"
    )
  ){

    return;

  }

  coins={
    m:0,
    e:0
  };

  upgradeTier=0;

  grid=
    Array(64).fill(1);

  selected=null;

  maxTileInRun=1;

  fillBoard();

  save();
  render();

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(text){

  return String(text)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

  const spawn=
    getSpawnTier();

  const cost=
    getCost();
const bestData =
  tiers[
    bestTileAllTime - 1
  ];

document.body.style.background =
  `hsl(${bestTileAllTime - 1}, 35%, 50%)`;
document.getElementById("s").innerText =
  "Coins: " + fNumRouter(coins) +
  "\nYou get " + fNumRouter(Income) + " coin(s) per second.";
  /* =====================================================
     SPAWN
     ===================================================== */

  document.getElementById(
    "p"
  ).innerText=
    "SPAWN KAFELKÓW: TIER "+
    spawn;


  /* =====================================================
     UPGRADE BUTTON
     ===================================================== */

  const uBtn=
    document.getElementById(
      "uBtn"
    );

  uBtn.innerText=
    "+1 BASE BLOCK (KOSZT: "+
    fNumRouter(cost)+
    ")";

  uBtn.disabled=
    !nGte(
      coins,
      cost
    );


  /* =====================================================
     BOARD
     ===================================================== */

  const board=
    document.getElementById(
      "g"
    );

  board.innerHTML="";


  grid.forEach(
    (tier,index)=>{

      const tile=
        document.createElement(
          "div"
        );

      tile.className=
        "tile";


      /* EMPTY */

      if(tier===0){

        tile.classList.add(
          "empty"
        );

      }


      /* NON-EMPTY */

      else{

        const data=
          tiers[tier-1];

        const name=
          data
            ?data.name
            :"Tier "+tier;

        const value=
          data
            ?data.value
            :"Next googologism";


        tile.style.background=
          tierColor(tier);


        if(
          selected===index
        ){

          tile.classList.add(
            "selected"
          );

        }


        const text=
          document.createElement(
            "div"
          );

        text.className=
          "tile-name";

        text.innerHTML=
          `<b>${
            escapeHTML(name)
          }</b>
           <br>
           <small>${
             escapeHTML(value)
           }</small>`;

        tile.appendChild(
          text
        );


        const tierText=
          document.createElement(
            "div"
          );

        tierText.className=
          "tile-tier";

        tierText.innerText=
          "T"+tier;

        tile.appendChild(
          tierText
        );

      }


      tile.onclick=
        ()=>clickTile(index);

      board.appendChild(
        tile
      );

    }
  );

document.getElementById("notationSelect").addEventListener("change", e => {
  setNotationMode(e.target.value);
  render();
});

  /* =====================================================
     BEST TILE
     ===================================================== */



  document.getElementById(
    "leaderboardList"
  ).innerHTML=
    `Najlepszy kafel:
     <b>Tier ${
       bestTileAllTime
     }</b>
     ${
       bestData
         ?" — "+
          escapeHTML(
            bestData.name
          )
         :""
     }`;

}


/* =========================================================
   PASSIVE COINS
   ========================================================= */
let Income = {
  m: 0,
  e: 0
};

setInterval(() => {

  Income = {
    m: 0,
    e: 0
  };

  grid.forEach(
    tier => {

      if (tier > 0) {

        Income =
          nAdd(
            Income,
            nPow(2.999, tier)
          );

      }

    }
  );

  coins =
    nAdd(
      coins,
      Income
    );

  save();
  render();

}, 1000);


/* =========================================================
   START
   ========================================================= */

if(
  grid.every(
    v=>v===0
  )
){

  fillBoard();

}

fillBoard();

save();

render();

</script>
